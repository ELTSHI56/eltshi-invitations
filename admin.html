<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — Invitations EL TSHI DIGIT</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Cormorant+Garamond:wght@500&family=Pinyon+Script&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ivoire:#F8F4EC;--noir:#1A1A1A;--or:#B8975A;--champ:#E8D9BF;--ligne:#E3DACB;--doux:#7A7062;--ok:#2f7a4f;--ko:#9b3b2a;--violet:#4B2E83}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:Montserrat,system-ui,sans-serif;font-size:14px;background:var(--ivoire);color:var(--noir);line-height:1.5}
h1,h2{font-family:"Cormorant Garamond",serif;font-weight:500}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--noir);background:var(--noir);color:#fff;padding:10px 16px;cursor:pointer;border-radius:4px;font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.clair{background:#fff;color:var(--noir);border-color:var(--ligne)}
.btn.or{background:var(--or);border-color:var(--or)}
.btn.danger{background:#fff;color:var(--ko);border-color:#e5c3bb}
.btn.mini{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:wait}
#connexion{min-height:100vh;display:grid;place-items:center;padding:20px}
.carte-cx{background:#fff;border:1px solid var(--ligne);padding:34px 28px;width:100%;max-width:400px;border-radius:8px;text-align:center}
.carte-cx h1{font-size:2rem;margin:10px 0 4px}
.carte-cx p{color:var(--doux)}
.carte-cx form{text-align:left;margin-top:24px}
label.l{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;margin:14px 0 6px}
.aide{font-size:12px;color:var(--doux);margin-top:4px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;border:1px solid var(--ligne);background:#fff;border-radius:4px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
textarea{min-height:90px;resize:vertical}
.msg{margin-top:12px;font-size:13px}
.msg.ko{color:var(--ko)}.msg.ok{color:var(--ok)}
.marque{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:26px;font-size:12px;color:var(--doux);text-decoration:none}
.marque b{font-family:"Space Grotesk";color:var(--violet)}
header.barre{position:sticky;top:0;z-index:20;background:var(--noir);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header.barre .titre{flex:1;min-width:160px}
header.barre .titre b{font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:500;display:block;line-height:1.1}
header.barre .titre small{color:#bdb3a2;font-size:11px}
#etat{font-size:12px;color:#d4b67a}
nav.onglets{display:flex;gap:2px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--ligne);padding:0 10px;position:sticky;top:58px;z-index:19}
nav.onglets button{border:0;background:none;padding:14px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--doux);border-bottom:2px solid transparent;white-space:nowrap}
nav.onglets button.actif{color:var(--noir);border-color:var(--or)}
.zone{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:1100px){.zone{grid-template-columns:minmax(0,1fr) 420px}.apercu{display:block!important}}
.panneau{padding:20px 16px 90px;max-width:860px;width:100%;margin:0 auto}
.apercu{display:none;position:sticky;top:106px;height:calc(100vh - 106px);border-left:1px solid var(--ligne);background:#ddd}
.apercu iframe{width:100%;height:100%;border:0;background:#fff}
.apercu.plein{display:block!important;position:fixed;inset:0;z-index:50;height:100vh;top:0}
.apercu .fermer-ap{display:none;position:absolute;top:10px;right:10px;z-index:2}
.apercu.plein .fermer-ap{display:inline-flex}
fieldset{border:1px solid var(--ligne);background:#fff;border-radius:8px;padding:6px 18px 18px;margin-bottom:18px}
legend{font-family:"Cormorant Garamond",serif;font-size:1.3rem;padding:0 6px}
.deux{display:grid;gap:0 14px}
@media(min-width:620px){.deux{grid-template-columns:1fr 1fr}.trois{grid-template-columns:1fr 1fr 1fr}}
.item{border:1px solid var(--ligne);border-radius:6px;padding:12px 14px;margin-top:12px;background:#fdfbf7}
.item .outils{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.item .entete-item{display:flex;align-items:center;gap:8px;font-weight:600}
.item .entete-item span{flex:1}
.cases{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px}
.cases label{display:flex;align-items:center;gap:6px;font-size:13px}
.photo-slot{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ligne)}
.photo-slot:last-child{border:0}
.vignette{width:84px;height:84px;border-radius:6px;background:var(--champ) center/cover;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:11px;text-align:center}
.photo-slot .info{flex:1}
.galerie-adm{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.galerie-adm .g{border:1px solid var(--ligne);border-radius:6px;overflow:hidden;background:#fff}
.galerie-adm .g .vignette{width:100%;height:120px;border-radius:0}
.galerie-adm .g input{border:0;border-top:1px solid var(--ligne);border-radius:0;font-size:12px}
.galerie-adm .g .outils{display:flex;justify-content:space-between;padding:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--ligne);border-radius:8px;padding:14px}
.stat b{display:block;font-family:"Cormorant Garamond",serif;font-size:2.2rem;line-height:1}
.stat span{font-size:12px;color:var(--doux)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--ligne);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:10px;border-bottom:1px solid var(--ligne);text-align:left;vertical-align:top}
th{background:#faf6ee;font-size:12px;white-space:nowrap}
td .det{font-size:12px;color:var(--doux)}
.oui{color:var(--ok);font-weight:600}.non{color:var(--ko);font-weight:600}
.barre-outils{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.barre-outils input{flex:1;min-width:180px}
.bas{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ligne);padding:10px 16px;display:flex;gap:10px;justify-content:flex-end;z-index:18}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--noir);color:#fff;padding:10px 18px;border-radius:4px;opacity:0;transition:opacity .3s;z-index:90;pointer-events:none}
#toast.vu{opacity:1}
.lien-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#faf6ee;border:1px dashed var(--or);padding:10px 12px;border-radius:6px;margin:8px 0;word-break:break-all}
@media print{header,nav,.bas,.barre-outils,.apercu,.suppr{display:none!important}.panneau{padding:0}body{background:#fff}}
</style>
</head>
<body>
<div id="toast" role="status"></div>
<section id="connexion">
<div class="carte-cx">
<p style="font-size:11px;letter-spacing:.3em;color:var(--or)">ESPACE ORGANISATEURS</p>
<h1>Administration</h1>
<p>Modifiez votre invitation et consultez les réponses.</p>
<form id="formCx">
<label class="l" for="cxSlug">Adresse de l'invitation</label>
<input type="text" id="cxSlug" placeholder="ex. elie-achou" autocapitalize="off" autocomplete="username" required>
<p class="aide">C'est la fin du lien : …vercel.app/<b>elie-achou</b></p>
<label class="l" for="cxCode">Code d'accès</label>
<input type="password" id="cxCode" autocomplete="current-password" required>
<p class="msg ko" id="cxMsg" hidden></p>
<button class="btn" style="width:100%;justify-content:center;margin-top:18px" id="cxBtn">Se connecter</button>
</form>
<a class="marque" href="https://wa.me/243844195449" target="_blank" rel="noopener">Réalisé par <b>EL TSHI DIGIT</b>+243 844 195 449</a>
</div>
</section>
<div id="ui" hidden>
<header class="barre">
<div class="titre"><b id="hTitre"></b><small id="hSlug"></small></div>
<span id="etat"></span>
<a class="btn clair mini" id="voir" target="_blank" rel="noopener">Voir l'invitation ↗</a>
<button class="btn clair mini" id="btnApercu" type="button">Aperçu</button>
<button class="btn clair mini" id="deco" type="button">Déconnexion</button>
</header>
<nav class="onglets" id="onglets"></nav>
<div class="zone">
<div class="panneau" id="panneau"></div>
<div class="apercu" id="apercu"><button class="btn mini fermer-ap" type="button" id="fermerAp">Fermer l'aperçu ✕</button><iframe id="ifr" title="Aperçu de l'invitation"></iframe></div>
</div>
<div class="bas" id="bas"><span class="aide" style="flex:1;align-self:center" id="basInfo">Les modifications sont visibles par les invités après enregistrement.</span><button class="btn or" id="sauver" type="button">Enregistrer les modifications</button></div>
</div>
<script>
const SB = { url: "https://vtizxpfxsozbotvkjsrg.supabase.co", cle: "sb_publishable_kPpkOa8UqHiuaSqsF6GqGQ_36GJcKt8" };
const ICONES = {accueil:"Accueil",alliances:"Alliances",photo:"Appareil photo",cocktail:"Cocktail",micro:"Micro / discours",diner:"Dîner",musique:"Musique",lune:"Lune / fin",coeur:"Cœur",gateau:"Gâteau",etoile:"Étoile",eglise:"Église",voiture:"Voiture",horloge:"Horloge",calendrier:"Calendrier",epingle:"Lieu"};
const ERR = {CODE_INCORRECT:"Code d'accès incorrect.",LISTE_INVALIDE:"Liste invalide (500 familles maximum à la fois).",LIMITE_ATTEINTE:"Limite atteinte (1000 familles maximum).",CODE_MAITRE_INCORRECT:"Code maître incorrect.",ADRESSE_INVALIDE:"Adresse invalide : lettres minuscules, chiffres et tirets uniquement (3 à 60).",ADRESSE_DEJA_PRISE:"Cette adresse est déjà utilisée.",ADRESSE_RESERVEE:"Ce mot est réservé, choisissez une autre adresse.",NUMERO_INVALIDE:"Numéro invalide : indiquez le numéro complet avec l'indicatif (ex. +243 844 195 449).",CODE_CLIENT_TROP_COURT:"Le code client doit faire au moins 6 caractères.",CONFIG_TROP_GRANDE:"Contenu trop volumineux.",FORMAT_NON_ACCEPTE:"Format non accepté (JPG, PNG ou WEBP).",TAILLE_INVALIDE:"Photo trop lourde."};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("vu"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("vu"),2600); }
function get(o,p){ return p.split(".").reduce((a,k)=>a==null?undefined:a[k],o); }
function set(o,p,v){ const ks=p.split("."); let a=o; ks.slice(0,-1).forEach(k=>{ if(typeof a[k]!=="object"||a[k]===null) a[k]={}; a=a[k]; }); a[ks.at(-1)]=v; }
async function rpc(fn,args){
const r = await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.cle,Authorization:"Bearer "+SB.cle},body:JSON.stringify(args)});
const t = await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch{}
if(!r.ok) throw new Error((j&&j.message)||"RESEAU");
return j;
}
const msgErr = e => ERR[e.message] || (e.message==="RESEAU"||e.message==="Failed to fetch" ? "Problème de connexion internet. Réessayez." : "Erreur : "+e.message);
let S = { slug:"", code:"", maitre:false, ev:null, cfg:{}, sale:false, onglet:"textes", reponses:[] };
(function init(){
const q = new URLSearchParams(location.search);
let mem = null; try{ mem = JSON.parse(sessionStorage.getItem("adm")||"null"); }catch{}
$("#cxSlug").value = q.get("e") || (mem&&mem.slug) || "";
if (mem && (!q.get("e") || q.get("e")===mem.slug)) connecter(mem.slug, mem.code, true);
})();
$("#formCx").addEventListener("submit", e => { e.preventDefault(); connecter($("#cxSlug").value.trim().toLowerCase(), $("#cxCode").value.trim()); });
async function connecter(slug, code, silencieux){
const m=$("#cxMsg"); m.hidden=true; const b=$("#cxBtn"); b.disabled=true;
try{
const ev = await rpc("config_admin",{p_slug:slug,p_code:code});
slug = ev.slug;
S = {...S, slug, code, maitre:!!ev.maitre, ev, acces:ev.acces||{}, cfg:clone(ev.config||{}), sale:false};
try{ sessionStorage.setItem("adm", JSON.stringify({slug,code})); }catch{}
demarrerUI();
}catch(e){ if(!silencieux){ m.textContent = e.message==="CODE_INCORRECT" ? "Adresse ou code incorrect." : msgErr(e); m.hidden=false; } }
finally{ b.disabled=false; }
}
$("#deco").onclick = () => { if(S.sale && !confirm("Des modifications ne sont pas enregistrées. Quitter quand même ?")) return; try{sessionStorage.removeItem("adm");}catch{} location.href = location.pathname; };
window.addEventListener("beforeunload", e => { if(S.sale){ e.preventDefault(); e.returnValue=""; } });
const ONGLETS = [["textes","Textes"],["programme","Programme"],["ceremonies","Cérémonies"],["infos","Lieu & infos"],["photos","Photos"],["formulaire","Formulaire"],["invites","Invités"],["reponses","Réponses"],["reglages","Partage & réglages"]];
function demarrerUI(){
$("#connexion").hidden = true; $("#ui").hidden = false;
$("#hTitre").textContent = S.ev.titre; $("#hSlug").textContent = "/" + S.slug + (S.maitre ? " · accès maître" : "");
$("#voir").href = lienOfficiel();
const ong = [...ONGLETS, ...(S.maitre ? [["invitations","Mes invitations ★"]] : [])];
$("#onglets").innerHTML = ong.map(([k,t]) => `<button type="button" data-o="${k}">${t}</button>`).join("");
$("#onglets").onclick = e => { const b=e.target.closest("button"); if(b) ouvrirOnglet(b.dataset.o); };
$("#ifr").src = srcApercu();
$("#ifr").onload = () => setTimeout(envoyerApercu, 400);
ouvrirOnglet(new URLSearchParams(location.search).get("onglet") || "textes");
majEtat();
}
function ouvrirOnglet(k){
S.onglet = k;
document.querySelectorAll("#onglets button").forEach(b => b.classList.toggle("actif", b.dataset.o===k));
$("#bas").hidden = ["reponses","invitations","invites"].includes(k);
({textes:oTextes, programme:oProgramme, ceremonies:oCeremonies, infos:oInfos, photos:oPhotos, formulaire:oFormulaire, reponses:oReponses, invites:oInvites, reglages:oReglages, invitations:oInvitations}[k] || oTextes)();
}
const lienOfficiel = () => location.origin + "/" + S.slug + (S.acces && S.acces.protege ? "?k=" + S.acces.cle : "");
const srcApercu = () => "/" + S.slug + "?direct=1" + (S.acces && S.acces.cle ? "&k=" + S.acces.cle : "");
function modifie(){ S.sale = true; majEtat(); clearTimeout(modifie.t); modifie.t = setTimeout(envoyerApercu, 350); }
function majEtat(){ $("#etat").textContent = S.sale ? "● Modifications non enregistrées" : "✓ Tout est enregistré"; }
function envoyerApercu(){ try{ $("#ifr").contentWindow.postMessage({type:"apercu", config:S.cfg, ouvrir:true}, location.origin); }catch{} }
$("#btnApercu").onclick = () => { $("#apercu").classList.add("plein"); envoyerApercu(); };
$("#fermerAp").onclick = () => $("#apercu").classList.remove("plein");
$("#sauver").onclick = sauver;
async function sauver(){
const b=$("#sauver"); b.disabled=true; b.textContent="Enregistrement…";
try{ await rpc("sauver_config",{p_slug:S.slug,p_code:S.code,p_config:S.cfg}); S.sale=false; majEtat(); toast("Modifications enregistrées ✓"); }
catch(e){ alert(msgErr(e)); }
finally{ b.disabled=false; b.textContent="Enregistrer les modifications"; }
}
function champ(path, label, type="text", aide="", attrs=""){
const v = get(S.cfg, path) ?? "";
const id = "f_" + path.replace(/\./g,"_");
const inp = type==="textarea" ? `<textarea id="${id}" data-p="${path}" ${attrs}>${esc(v)}</textarea>` : `<input type="${type}" id="${id}" data-p="${path}" value="${esc(v)}" ${attrs}>`;
return `<div><label class="l" for="${id}">${label}</label>${inp}${aide?`<p class="aide">${aide}</p>`:""}</div>`;
}
function lier(racine){ racine.querySelectorAll("[data-p]").forEach(el => el.addEventListener("input", () => { set(S.cfg, el.dataset.p, el.value); modifie(); })); }
function rendrePanneau(html){ const p=$("#panneau"); p.innerHTML = html; lier(p); window.scrollTo({top:0}); return p; }
function oTextes(){
rendrePanneau(`
<fieldset><legend>Le couple / les hôtes</legend><div class="deux">
${champ("couple.prenom1","Prénom 1")}${champ("couple.prenom2","Prénom 2")}
${champ("couple.nomsComplets","Noms complets","text","Affiché sous la présentation.")}${champ("couple.hashtag","Hashtag (facultatif)")}
</div></fieldset>
<fieldset><legend>Date et heure</legend><div class="deux trois">
${champ("date.jour","Date de l'événement","date")}${champ("date.heure","Heure de début","time","Laisser vide si pas encore fixée.")}${champ("date.heureFin","Heure de fin","time")}
</div></fieldset>
<fieldset><legend>1 · Couverture</legend>
${champ("couverture.surtitre","Surtitre")}${champ("couverture.citation","Phrase sous la date")}${champ("couverture.bouton","Texte du bouton")}
</fieldset>
<fieldset><legend>2 · Présentation</legend><div class="deux">
${champ("presentation.titre","Titre")}${champ("presentation.sousTitre","Sous-titre (en calligraphie)")}</div>
${champ("presentation.message","Message d'accueil","textarea")}
</fieldset>
<fieldset><legend>3 · Compte à rebours</legend><div class="deux">
${champ("compte.titre","Titre")}${champ("compte.fin","Message quand l'événement commence")}</div>
</fieldset>
<fieldset><legend>Titres des sections</legend><div class="deux">
${champ("programme.titre","Programme — titre")}${champ("programme.sousTitre","Programme — sous-titre")}
${champ("galerie.titre","Galerie — titre")}${champ("galerie.sousTitre","Galerie — sous-titre")}
${champ("pratique.titre","Infos pratiques — titre")}
</div></fieldset>
<fieldset><legend>7 · Formulaire de confirmation</legend>
${champ("rsvp.titre","Titre")}${champ("rsvp.sousTitre","Sous-titre")}
<div class="deux">${champ("rsvp.dateLimite","Date limite de réponse","date")}${champ("rsvp.bouton","Texte du bouton")}</div>
</fieldset>
<fieldset><legend>8 · Page de remerciement</legend>
${champ("merci.titre","Titre")}${champ("merci.texte","Texte","textarea")}${champ("merci.signature","Formule de fin")}
</fieldset>
<fieldset><legend>9 · Page finale</legend><div class="deux">
${champ("finale.haut","Petit texte du haut")}${champ("finale.grand","Grand texte")}
${champ("finale.limite","Ligne date limite")}${champ("finale.bouton","Texte du bouton")}
${champ("finale.script","Mot en calligraphie")}</div>
</fieldset>
<fieldset><legend>Partage</legend>
${champ("partage.message","Message envoyé avec le lien WhatsApp","textarea")}${champ("meta.titreOnglet","Titre de l'onglet du navigateur")}
</fieldset>`);
}
const CER_DEF = [{type:"coutumier",nom:"Mariage coutumier",sousTitre:"La dot et la bénédiction des familles"},{type:"civil",nom:"Mariage civil",sousTitre:"À la maison communale"},{type:"religieux",nom:"Mariage religieux",sousTitre:"Bénédiction nuptiale"}];
function oCeremonies(){
if (!get(S.cfg,"ceremonies") || typeof S.cfg.ceremonies !== "object") set(S.cfg,"ceremonies",{});
const ce = S.cfg.ceremonies;
if (!Array.isArray(ce.liste)) ce.liste = [];
CER_DEF.forEach(d => { if (!ce.liste.find(x => x && x.type === d.type)) ce.liste.push({...d, afficher:true, date:"", heure:"", lieu:"", adresse:""}); });
const p = rendrePanneau(`<fieldset><legend>Section « Cérémonies »</legend>
<label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin:6px 0 12px"><input type="checkbox" id="cerActif" style="width:auto" ${ce.actif===false?"":"checked"}> <b>Afficher la section dans l'invitation</b></label>
${champ("ceremonies.titre","Titre de la section","text","Vide = Nos trois « oui »")}
${champ("ceremonies.sousTitre","Petite phrase sous le titre (facultatif)")}
<p class="aide">La section apparaît juste après le compte à rebours. Une cérémonie cochée « Afficher » apparaît même sans date ni lieu, avec la mention « Date et lieu bientôt communiqués ». Décochez-la si elle n'a pas lieu.</p></fieldset>
${ce.liste.map((x,i)=>`<fieldset><legend>${esc(x.nom||"Cérémonie")}</legend>
<label style="display:flex;gap:8px;align-items:center;cursor:pointer;margin:4px 0 10px"><input type="checkbox" class="cerAff" data-i="${i}" style="width:auto" ${x.afficher===false?"":"checked"}> Afficher cette cérémonie</label>

async function reduire(fichier){
const img = await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=URL.createObjectURL(fichier); });
const max=1600, r=Math.min(1, max/Math.max(img.width,img.height));
const c=document.createElement("canvas"); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src);
return c.toDataURL("image/jpeg",0.85);
}
async function envoyerPhoto(fichier, dataDeja){
const data = dataDeja || await reduire(fichier);
const r = await fetch(`${SB.url}/functions/v1/photo`,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.cle},body:JSON.stringify({slug:S.slug,code:S.code,type:"image/jpeg",data})});
const j = await r.json().catch(()=>({}));
if(!r.ok||!j.url) throw new Error(j.erreur||"RESEAU");
return j.url;
}
function chargerImage(src){ return new Promise((ok,ko)=>{ const i=new Image(); i.crossOrigin="anonymous"; i.onload=()=>ok(i); i.onerror=()=>ko(new Error("IMAGE_ILLISIBLE")); i.src=src; }); }
async function composerApercu(source){
const img = await chargerImage(typeof source==="string" ? source : URL.createObjectURL(source));
try { await document.fonts.load('92px "Pinyon Script"'); await document.fonts.load('600 20px Montserrat'); } catch {}
const W=1200,H=630,c=document.createElement("canvas"); c.width=W; c.height=H; const x=c.getContext("2d");
const r=Math.max(W/img.width,H/img.height), w=img.width*r, h=img.height*r;
x.drawImage(img,(W-w)/2,(H-h)/2.6,w,h);
const gr=x.createLinearGradient(0,0,0,H); gr.addColorStop(0,"rgba(0,0,0,.08)"); gr.addColorStop(.5,"rgba(0,0,0,.18)"); gr.addColorStop(1,"rgba(0,0,0,.72)");
x.fillStyle=gr; x.fillRect(0,0,W,H);
x.strokeStyle="rgba(212,182,122,.8)"; x.lineWidth=2; x.strokeRect(20,20,W-40,H-40);
x.strokeStyle="rgba(212,182,122,.4)"; x.lineWidth=1; x.strokeRect(30,30,W-60,H-60);
x.textAlign="center"; x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=18;
const p1=get(S.cfg,"couple.prenom1")||"", p2=get(S.cfg,"couple.prenom2")||"";
x.fillStyle="#D4B67A"; x.font='600 19px Montserrat, Arial, sans-serif';
const sur=(get(S.cfg,"couverture.surtitre")||"").toUpperCase(); if (x.letterSpacing!==undefined) x.letterSpacing="6px"; x.fillText(sur,W/2,438);
if (x.letterSpacing!==undefined) x.letterSpacing="0px";
x.fillStyle="#fff"; x.font='92px "Pinyon Script", cursive'; x.fillText(`${p1} & ${p2}`,W/2,530);
const j=get(S.cfg,"date.jour"); if (j) { x.fillStyle="#E8D9BF"; x.font='500 20px Montserrat, Arial, sans-serif'; if (x.letterSpacing!==undefined) x.letterSpacing="7px";
x.fillText(new Date(j+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}).toUpperCase(),W/2,583); }
if (typeof source!=="string") URL.revokeObjectURL(img.src);
return c.toDataURL("image/jpeg",0.82);
}
