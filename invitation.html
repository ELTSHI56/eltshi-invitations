<head>

<style>
:root{--ivoire:#F8F4EC;--ivoire2:#F1EADD;--noir:#1A1A1A;--champ:#E8D9BF;--or:#B8975A;--or2:#D4B67A;--texte:#3A342C;--doux:#7A7062;--serif:"Cormorant Garamond",Georgia,serif;--script:"Pinyon Script",cursive;--sans:Montserrat,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--ivoire);color:var(--texte);font-family:var(--serif);font-size:1.16rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.ferme{overflow:hidden;height:100vh}
img{max-width:100%;display:block}
a{color:inherit}
.or{color:var(--or)}
.petit{font-family:var(--sans);font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;font-weight:500}
#charge{position:fixed;inset:0;background:var(--noir);display:grid;place-items:center;z-index:200;transition:opacity .6s}
#charge.fin{opacity:0;pointer-events:none}
#charge .mono{font-family:var(--script);color:var(--or2);font-size:3.4rem;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#introuvable{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
#couv{position:fixed;inset:0;z-index:100;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;transition:transform 1.2s cubic-bezier(.7,0,.2,1),opacity 1.2s}
#couv.ouvert{transform:translateY(-100%);opacity:.6}
#couv.parti{display:none}
#couv .fond{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05) brightness(.62);animation:zoom 22s ease-in-out infinite alternate}
#couv .fond.vide{filter:none;background:radial-gradient(ellipse at 50% 35%,#3a352d 0%,#16140f 70%)}
@keyframes zoom{to{transform:scale(1.08)}}
#couv .voile{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15) 40%,rgba(0,0,0,.6))}
#couv .cadre{position:absolute;inset:16px;border:1px solid rgba(212,182,122,.55);pointer-events:none}
#couv .cadre::after{content:"";position:absolute;inset:6px;border:1px solid rgba(212,182,122,.25)}
#couv .contenu{position:relative;padding:40px 26px;max-width:620px}
#couv .surtitre{color:var(--champ);opacity:0;animation:monte 1.2s .3s forwards}
#couv .noms{font-family:var(--script);font-weight:400;font-size:clamp(3.6rem,15vw,6.6rem);line-height:1.05;margin:22px 0 8px;color:#fff;opacity:0;animation:monte 1.4s .7s forwards;text-shadow:0 2px 30px rgba(0,0,0,.35)}
#couv .noms .et{color:var(--or2);font-size:.7em;padding:0 .12em}
#couv .date{font-family:var(--sans);letter-spacing:.42em;font-size:.82rem;color:var(--champ);opacity:0;animation:monte 1.2s 1.2s forwards}
#couv .citation{font-style:italic;font-size:1.22rem;margin:22px auto 34px;max-width:420px;color:#efe8db;opacity:0;animation:monte 1.2s 1.6s forwards}
#couv .trait{width:70px;height:1px;background:var(--or2);margin:18px auto 0;opacity:0;animation:monte 1.2s 1s forwards}
@keyframes monte{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.btn-or{font-family:var(--sans);font-size:.72rem;letter-spacing:.28em;font-weight:500;text-transform:uppercase;color:#fff;background:transparent;border:1px solid var(--or2);padding:17px 30px;cursor:pointer;position:relative;overflow:hidden;transition:color .4s;text-decoration:none;display:inline-block}
.btn-or::before{content:"";position:absolute;inset:0;background:var(--or);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn-or:hover::before,.btn-or:focus-visible::before{transform:scaleX(1)}
.btn-or{z-index:0}
#couv .btn-or{opacity:0;animation:monte 1.2s 2s forwards,brille 3s 3.2s ease-in-out infinite}
@keyframes brille{50%{box-shadow:0 0 0 6px rgba(212,182,122,.12),0 0 28px rgba(212,182,122,.35)}}
#couv .verrou{opacity:0;animation:monte 1.2s 2s forwards;max-width:420px;margin:0 auto}
#couv .verrou p{font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;line-height:1.7;color:#d9cfbf;margin-bottom:20px}
#couv .verrou .btn-or{opacity:1;animation:none;display:inline-flex;gap:10px;align-items:center}
#couv .verrou svg{width:18px;height:18px}
#couv .marque{position:absolute;bottom:26px;left:0;right:0;font-family:var(--sans);font-size:.62rem;letter-spacing:.2em;color:rgba(255,255,255,.55)}
.paillette{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--or2);opacity:0;animation:scintille 4s infinite}
@keyframes scintille{20%{opacity:.9}60%{opacity:0;transform:translateY(-40px)}}
section{padding:88px 22px;position:relative}
.cont{max-width:980px;margin:0 auto}
.entete{text-align:center;margin-bottom:46px}
.entete .petit{color:var(--or)}
.entete h2{font-weight:500;font-size:clamp(2.1rem,7vw,3.1rem);line-height:1.15;color:var(--noir);margin-top:10px}
.entete h2 em{font-family:var(--script);font-style:normal;color:var(--or);font-weight:400}
.entete .sous{font-style:italic;color:var(--doux);margin-top:8px}
.orn{display:block;margin:16px auto 0;width:150px;height:34px;color:var(--or)}
.revele{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s ease}
.revele.vu{opacity:1;transform:none}
.fond-champ{background:var(--ivoire2)}
.fond-noir{background:var(--noir);color:#efe8db}
.fond-noir .entete h2{color:#fff}
#presentation .grille{display:grid;gap:44px;align-items:center}
.arche{position:relative;max-width:360px;margin:0 auto;width:100%}
.arche .img{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;overflow:hidden;background:linear-gradient(160deg,var(--champ),#cdb995);position:relative;box-shadow:0 30px 60px -30px rgba(60,40,10,.45)}
.arche .img img{width:100%;height:100%;object-fit:cover}
.arche::before{content:"";position:absolute;inset:-12px;border:1px solid var(--or);border-radius:999px 999px 10px 10px;opacity:.6}
.arche .brin1{position:absolute;width:150px;left:-46px;bottom:-14px;transform:rotate(-24deg);color:var(--or)}
.arche .brin2{position:absolute;width:120px;right:-40px;top:18%;transform:rotate(200deg);color:#a88a55}
.monogramme{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--script);font-size:4.4rem;color:rgba(255,255,255,.9)}
.infos-cle{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px;margin:26px 0;font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--noir)}
.infos-cle span{display:flex;align-items:center;gap:8px}
.infos-cle svg{width:18px;height:18px;color:var(--or)}
.texte-pres{text-align:center;font-size:1.24rem;max-width:560px;margin:0 auto}
.texte-pres::first-letter{font-family:var(--script);font-size:3.2em;float:left;line-height:.8;padding:6px 8px 0 0;color:var(--or)}
.signature-noms{font-family:var(--script);font-size:2.2rem;color:var(--or);text-align:center;margin-top:20px}
#compte{text-align:center;overflow:hidden}
#compte .grille-cpt{display:flex;justify-content:center;gap:clamp(10px,4vw,34px);margin-top:10px}
.case{min-width:70px}
.ceremonies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:8px}
.cer{background:#fff;border:1px solid var(--champ);padding:30px 24px 26px;text-align:center;position:relative}
.cer::before{content:"";position:absolute;inset:6px;border:1px solid rgba(184,151,90,.25);pointer-events:none}
.cer .rond{width:58px;height:58px;border-radius:50%;background:var(--noir);color:var(--or2);display:grid;place-items:center;margin:0 auto 14px}
.cer .rond svg{width:26px;height:26px}
.cer h3{font-family:var(--serif);font-weight:500;font-size:1.55rem;color:var(--noir);line-height:1.2}
.cer .st{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--or);margin:6px 0 16px}
.cer .ligne{display:flex;gap:10px;align-items:flex-start;justify-content:center;font-family:var(--sans);font-size:.92rem;color:var(--texte);margin:6px 0}
.cer .ligne svg{width:17px;height:17px;color:var(--or);flex:none;margin-top:2px}
.cer .bt-cal{margin-top:18px;font-family:var(--sans);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;background:none;border:1px solid var(--noir);color:var(--noir);padding:11px 18px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.cer .bt-cal svg{width:15px;height:15px}
.cer .bt-cal:hover{background:var(--noir);color:#fff}
.case b{display:block;font-weight:400;font-size:clamp(2.6rem,11vw,4.4rem);line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.case small{display:block;margin-top:10px;color:var(--or2);letter-spacing:.16em!important;font-size:.62rem!important}
.case+.case{border-left:1px solid rgba(212,182,122,.3);padding-left:clamp(10px,4vw,34px)}
#compte .fini{font-style:italic;font-size:1.5rem;color:var(--champ)}
#compte .date-longue{margin-top:30px;font-style:italic;color:var(--champ)}
#compte .anneaux{position:absolute;right:-60px;top:-40px;width:260px;opacity:.07;color:var(--or2)}
.ligne-temps{position:relative;max-width:820px;margin:0 auto;padding:10px 0}
.ligne-temps::before{content:"";position:absolute;left:27px;top:0;bottom:0;width:1px;background:linear-gradient(var(--or),var(--or) 90%,transparent)}
.etape{position:relative;padding:0 0 38px 78px}
.etape .pastille{position:absolute;left:0;top:0;width:55px;height:55px;border-radius:50%;background:var(--ivoire);border:1px solid var(--or);display:grid;place-items:center;color:var(--or);box-shadow:0 0 0 6px var(--ivoire)}
.etape .pastille svg{width:24px;height:24px}
.etape .heure{font-family:var(--sans);font-size:.74rem;letter-spacing:.24em;color:var(--or);font-weight:600}
.etape h3{font-weight:500;font-size:1.55rem;color:var(--noir);line-height:1.2}
.etape p{color:var(--doux);font-style:italic}
@media(min-width:760px){
.ligne-temps::before{left:50%}
.etape{width:50%;padding:0 62px 46px 0;text-align:right}
.etape .pastille{left:auto;right:-28px}
.etape:nth-child(even){margin-left:50%;padding:0 0 46px 62px;text-align:left}
.etape:nth-child(even) .pastille{right:auto;left:-27px}
}
.note-horaire{text-align:center;font-style:italic;color:var(--doux);margin-top:6px}
.cartes{display:grid;gap:18px}
.carte{background:#fff;border:1px solid var(--champ);padding:32px 26px;text-align:center;position:relative}
.carte::before{content:"";position:absolute;inset:7px;border:1px solid rgba(184,151,90,.18);pointer-events:none}
.carte svg.ic,.carte-lieu svg.ic{width:34px;height:34px;color:var(--or);margin:0 auto 14px}
.carte h3{font-family:var(--sans);font-size:.78rem;letter-spacing:.28em;font-weight:600;text-transform:uppercase;color:var(--noir);margin-bottom:10px}
.carte p{white-space:pre-line}
.carte .vide{font-style:italic;color:var(--doux)}
.carte-lieu{margin-top:18px;background:#fff;border:1px solid var(--champ);overflow:hidden}
.carte-lieu .haut{padding:30px 24px;text-align:center}
.carte-lieu h3{font-weight:500;font-size:1.8rem;color:var(--noir)}
.carte-lieu .adr{color:var(--doux);font-style:italic;margin-bottom:20px}
.carte-lieu iframe{display:block;width:100%;height:320px;border:0;filter:grayscale(.85) sepia(.15)}
.btn-noir{font-family:var(--sans);font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;background:var(--noir);color:#fff;border:0;padding:16px 26px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px;transition:background .3s}
.btn-noir:hover{background:var(--or)}
.btn-noir svg{width:16px;height:16px}
@media(min-width:760px){.cartes{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}#presentation .grille{grid-template-columns:1fr 1.1fr}}
.galerie{columns:2;column-gap:12px}
@media(min-width:760px){.galerie{columns:3;column-gap:16px}}
.tuile{break-inside:avoid;margin-bottom:12px;position:relative;overflow:hidden;cursor:zoom-in;background:var(--champ)}
.tuile img{width:100%;transition:transform 1.2s ease,filter .6s}
.tuile:hover img{transform:scale(1.05)}
.tuile figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-style:italic;font-size:1rem;opacity:0;transition:opacity .5s}
.tuile:hover figcaption{opacity:1}
.tuile.vide{cursor:default;display:grid;place-items:center;color:rgba(255,255,255,.85);font-family:var(--script);font-size:2.6rem}
.tuile.vide:nth-child(3n+1){aspect-ratio:3/4;background:linear-gradient(160deg,#e8d9bf,#c9b28a)}
.tuile.vide:nth-child(3n+2){aspect-ratio:1;background:linear-gradient(160deg,#d8c7a6,#a98d5c)}
.tuile.vide:nth-child(3n){aspect-ratio:4/5;background:linear-gradient(160deg,#3b362e,#1a1a1a)}
#visionneuse{position:fixed;inset:0;background:rgba(15,13,10,.95);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#visionneuse img{max-height:80vh;max-width:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#visionneuse p{color:var(--champ);font-style:italic;margin-top:14px;text-align:center}
#visionneuse button{position:absolute;background:none;border:1px solid rgba(212,182,122,.5);color:#fff;width:46px;height:46px;border-radius:50%;cursor:pointer;font-size:1.2rem}
#visionneuse .fermer{top:18px;right:18px}
#visionneuse .prec{left:14px;top:50%}
#visionneuse .suiv{right:14px;top:50%}
#rsvp .boite{max-width:640px;margin:0 auto;background:#fff;padding:42px 26px;border:1px solid var(--champ);position:relative}
#rsvp .boite::before{content:"";position:absolute;inset:8px;border:1px solid rgba(184,151,90,.2);pointer-events:none}
.champ{margin-bottom:24px;position:relative}
.champ>label,.champ>.lab{display:block;font-family:var(--sans);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--noir);font-weight:500;margin-bottom:10px;line-height:1.5}
.champ .req{color:var(--or)}
.champ input[type=text],.champ input[type=tel],.champ input[type=number],.champ textarea{width:100%;border:0;border-bottom:1px solid #cfc3ad;background:transparent;font-family:var(--serif);font-size:1.2rem;padding:8px 2px;color:var(--noir);outline:none;transition:border-color .3s;border-radius:0}
.champ textarea{min-height:110px;resize:vertical;border:1px solid #cfc3ad;padding:12px}
.champ input:focus,.champ textarea:focus{border-color:var(--or)}
.choix{display:flex;flex-wrap:wrap;gap:10px}
.choix label{flex:1 1 120px;position:relative;cursor:pointer}
.choix input{position:absolute;opacity:0;pointer-events:none}
.choix span{display:block;text-align:center;border:1px solid #cfc3ad;padding:13px 12px;font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;transition:all .3s}
.choix input:checked+span{background:var(--noir);border-color:var(--noir);color:#fff}
.choix input:focus-visible+span{outline:2px solid var(--or);outline-offset:2px}
.compteur{display:flex;align-items:center;gap:0;border:1px solid #cfc3ad;width:max-content}
.compteur button{width:48px;height:48px;border:0;background:transparent;font-size:1.4rem;cursor:pointer;color:var(--noir)}
.compteur input{width:64px!important;text-align:center;border:0!important;font-size:1.3rem!important}
.erreur{color:#9b3b2a;font-family:var(--sans);font-size:.8rem;margin-top:8px}
#envoyer{width:100%;margin-top:6px;justify-content:center;padding:19px}
#envoyer[disabled]{opacity:.6;cursor:wait}
.limite{text-align:center;font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;color:var(--or);margin-top:-26px;margin-bottom:34px;text-transform:uppercase}
.merci-vue{text-align:center}
.merci-vue .photo-merci{width:170px;height:170px;border-radius:50%;margin:0 auto 26px;overflow:hidden;border:1px solid var(--or);padding:6px;background:#fff}
.merci-vue .photo-merci>div{width:100%;height:100%;border-radius:50%;background:linear-gradient(160deg,var(--champ),#b89d6c);background-size:cover;background-position:center;display:grid;place-items:center;font-family:var(--script);color:#fff;font-size:2.6rem;filter:grayscale(.2)}
.merci-vue h3{font-weight:500;font-size:1.7rem;line-height:1.3;color:var(--noir)}
.merci-vue p{margin-top:14px;font-style:italic;color:var(--doux)}
.merci-vue .sig{font-family:var(--script);color:var(--or);font-size:2.4rem;margin-top:8px;font-style:normal}
#finale{text-align:center;padding:110px 22px 90px;overflow:hidden}
#finale .please{letter-spacing:.6em;color:var(--or2)}
#finale .gros{font-weight:400;font-size:clamp(4.4rem,22vw,8.6rem);letter-spacing:.12em;line-height:1;margin:14px 0 8px;color:#fff;padding-left:.12em}
#finale .lim{font-family:var(--sans);letter-spacing:.34em;font-size:.76rem;color:var(--champ);margin-bottom:38px}
#finale .merci-script{font-family:var(--script);font-size:clamp(3.4rem,13vw,5.4rem);color:var(--or2);margin-top:54px;line-height:1.1}
#finale .noms-fin{font-family:var(--sans);letter-spacing:.38em;font-size:.78rem;color:#efe8db;margin-top:6px}
#finale .brin-g{position:absolute;width:280px;left:-70px;top:30px;transform:rotate(18deg);color:var(--or);opacity:.35}
#finale .brin-d{position:absolute;width:280px;right:-70px;bottom:40px;transform:rotate(198deg);color:var(--or);opacity:.35}
footer{background:#111;color:#bdb3a2;text-align:center;padding:46px 22px 110px}
.partage{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.partage button,.partage a{font-family:var(--sans);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;background:transparent;border:1px solid rgba(212,182,122,.5);color:#efe8db;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-flex;gap:8px;align-items:center}
.partage svg{width:16px;height:16px}
.signature{display:inline-flex;flex-direction:column;align-items:center;gap:6px;background:#fff;padding:16px 24px;border-radius:18px;text-decoration:none;color:#6E6886;font-family:var(--sans);font-size:.72rem}
.signature .tel{font-family:"Space Grotesk",var(--sans);font-weight:700;color:#4B2E83;font-size:.98rem}
#flottant{position:fixed;right:16px;bottom:16px;z-index:60;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.25);text-decoration:none;transform:scale(0);transition:transform .4s}
#flottant.vu{transform:scale(1)}
#flottant svg{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--noir);color:#fff;font-family:var(--sans);font-size:.8rem;padding:12px 20px;opacity:0;transition:all .4s;z-index:170;pointer-events:none}
#toast.vu{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}#couv *{opacity:1!important}.revele{opacity:1;transform:none}}
</style>
</head>

const loc = INVI ? null : lireLocal(); if (loc && !window.APERCU) return vueMerci(loc.presence, true);
if (EV.ouvert === false) { $("#boiteRsvp").innerHTML = `<p style="text-align:center;font-style:italic">Les confirmations sont désormais closes. Pour toute question, contactez directement les organisateurs.</p>`; return; }
const r = g(C,"rsvp",{}), qs = r.questions || [], tel = r.telephone || "facultatif";
const champQ = q => {
const ob = q.obligatoire ? ' <span class="req">*</span>' : "";
let inner = "";
if (q.type === "choix") {
const opts = [...(q.options||[]), ...(q.autre ? ["Autre"] : [])];
inner = `<div class="lab">${esc(q.label)}${ob}</div><div class="choix">${opts.map(o=>`<label><input type="radio" name="q_${esc(q.id)}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>
${q.autre?`<div class="champ" data-autre="${esc(q.id)}" hidden style="margin:14px 0 0"><input type="text" maxlength="200" placeholder="Précisez…" aria-label="Précisez"></div>`:""}`;
} else if (q.type === "nombre") {
const mn = q.min ?? 1, mx = q.max ?? 20;
inner = `<label for="q_${esc(q.id)}">${esc(q.label)}${ob}</label><div class="compteur"><button type="button" data-d="-1" aria-label="Moins">−</button><input type="number" id="q_${esc(q.id)}" inputmode="numeric" min="${mn}" max="${mx}" value="${mn}"><button type="button" data-d="1" aria-label="Plus">+</button></div>`;
} else if (q.type === "paragraphe") {
inner = `<label for="q_${esc(q.id)}">${esc(q.label)}${ob}</label><textarea id="q_${esc(q.id)}" maxlength="1000"></textarea>`;
} else {
inner = `<label for="q_${esc(q.id)}">${esc(q.label)}${ob}</label><input type="text" id="q_${esc(q.id)}" maxlength="200">`;
}
return `<div class="champ" data-q="${esc(q.id)}">${inner}</div>`;
};
$("#boiteRsvp").innerHTML = `<form id="formRsvp" novalidate>
${INVI?`<p class="petit or" style="text-align:center;margin-bottom:18px">Invitation personnelle pour <b>${esc(INVI.nom)}</b> · ${INVI.places} place${INVI.places>1?"s":""}</p>`:""}
<div class="champ"><label for="fNom">Nom complet <span class="req">*</span></label><input type="text" id="fNom" maxlength="120" autocomplete="name" required ${INVI?`value="${esc(INVI.nom)}" readonly`:""}></div>
<div class="champ"><div class="lab">Serez-vous présent(e) ? <span class="req">*</span></div><div class="choix">
<label><input type="radio" name="presence" value="oui"><span>Oui, avec plaisir</span></label>
<label><input type="radio" name="presence" value="non"><span>Non, je ne pourrai pas</span></label></div></div>
${tel!=="masque"?`<div class="champ"><label for="fTel">Numéro de téléphone${tel==="obligatoire"?' <span class="req">*</span>':" (facultatif)"}</label><input type="tel" id="fTel" maxlength="30" autocomplete="tel" placeholder="+243 …"></div>`:""}
${qs.map(champQ).join("")}
<p class="erreur" id="errRsvp" role="alert" hidden></p>
<button class="btn-noir" id="envoyer" type="submit">${esc(r.bouton||"ENVOYER MA CONFIRMATION")}</button>
</form>`;
const f = $("#formRsvp");
const lireQ = q => {
const box = f.querySelector(`[data-q="${CSS.escape(q.id)}"]`);
if (q.type === "choix") { const c = box.querySelector("input[type=radio]:checked"); if (!c) return ""; if (c.value === "Autre" && q.autre) { const t = box.querySelector("[data-autre] input").value.trim(); return t ? "Autre : " + t : "Autre"; } return c.value; }
const el = box.querySelector("input,textarea"); return el ? el.value.trim() : "";
};
const presence = () => { const c = f.querySelector("input[name=presence]:checked"); return c ? c.value === "oui" : null; };
const visible = q => {
const p = presence();
if (q.siPresent && p !== true) return false;
if (q.condition && q.condition.id) { const cq = qs.find(x => x.id === q.condition.id); if (!cq || !visible(cq) || lireQ(cq) !== q.condition.valeur) return false; }
return true;
};
const maj = () => {
qs.forEach(q => { f.querySelector(`[data-q="${CSS.escape(q.id)}"]`).hidden = !visible(q); });
f.querySelectorAll("[data-autre]").forEach(a => { const c = a.parentElement.querySelector("input[type=radio]:checked"); a.hidden = !(c && c.value === "Autre"); });
};
if (INVI) qs.filter(q => q.role === "total").forEach(q => { const i = f.querySelector(`[data-q="${CSS.escape(q.id)}"] input`); if (i) { i.max = INVI.places; if (+i.value > INVI.places) i.value = INVI.places; const l = f.querySelector(`[data-q="${CSS.escape(q.id)}"] label`); if (l) l.insertAdjacentHTML("beforeend", ` <span style="font-weight:400">(maximum ${INVI.places})</span>`); } });
f.addEventListener("change", maj); f.addEventListener("input", maj);
f.querySelectorAll(".compteur button").forEach(b => b.addEventListener("click", () => { const i = b.parentElement.querySelector("input"); const v = Math.min(+i.max, Math.max(+i.min, (+i.value||0) + +b.dataset.d)); i.value = v; }));
maj();
f.addEventListener("submit", async ev => {
ev.preventDefault(); const err = $("#errRsvp"); err.hidden = true;
const montrer = t => { err.textContent = t; err.hidden = false; };
const nom = $("#fNom").value.trim(), p = presence(), telV = $("#fTel") ? $("#fTel").value.trim() : "";
if (nom.length < 2) return montrer("Merci d'indiquer votre nom complet.");
if (p === null) return montrer("Merci d'indiquer si vous serez présent(e).");
if (tel === "obligatoire" && telV.replace(/\D/g,"").length < 9) return montrer("Merci d'indiquer un numéro de téléphone valide.");
const details = {}; let total = p ? 1 : 0, message = "";
for (const q of qs) {
if (!visible(q)) continue;
const v = lireQ(q);
if (q.obligatoire && !v) return montrer(`Merci de répondre à : « ${q.label} »`);
if (q.role === "total") { const n = parseInt(v,10); if (p && (!n || n < (q.min ?? 1))) return montrer(`Merci d'indiquer le nombre de personnes.`); total = p ? n : 0; }
if (q.role === "message") { message = v; continue; }
if (v) details[q.label] = v;
}
if (INVI && p && !qs.some(q => q.role === "total")) total = INVI.places;
if (window.APERCU) { toast("Aperçu : la réponse n'est pas enregistrée."); return; }
const b = $("#envoyer"); b.disabled = true; b.textContent = "Envoi en cours…";
try {
await rpc("repondre_v3", {p_evenement: SLUG, p_nom: nom, p_presence: p, p_total: INVI ? Math.min(total, INVI.places) : total, p_telephone: telV || null, p_details: details, p_message: message || null, p_cle: CLE || null, p_invite: INVI ? INV : null});
if (INVI) { INVI.repondu = true; INVI.presence = p; }
try { if (!INVI) localStorage.setItem(CLE_LOCALE(), JSON.stringify({nom, presence: p})); } catch {}
vueMerci(p, false); $("#rsvp").scrollIntoView({behavior:"smooth"});
} catch (e) {
const M = {LIEN_PERSONNEL_REQUIS:"Les confirmations se font avec votre lien personnel. Demandez-le aux organisateurs.", LIEN_NON_AUTORISE:"Ce lien d'invitation n'est plus valide. Demandez un nouveau lien aux organisateurs.", DEJA_REPONDU: INVI ? "Une réponse a déjà été enregistrée avec ce lien personnel. Pour la modifier, contactez directement les organisateurs." : "Une réponse a déjà été enregistrée à ce nom ou avec ce numéro. Pour la modifier, contactez directement les organisateurs.", TELEPHONE_INVALIDE:"Merci d'indiquer un numéro de téléphone valide.", NOM_MANQUANT:"Merci d'indiquer votre nom complet.", EVENEMENT_FERME:"Les confirmations sont closes.", LIEN_NON_AUTORISE:"Ce lien ne permet pas de confirmer. Demandez le lien officiel aux organisateurs.", LIMITE_ATTEINTE:"Le nombre maximum de réponses est atteint."};
montrer(M[e.message] || "L'envoi n'a pas abouti. Vérifiez votre connexion internet et réessayez.");
b.disabled = false; b.textContent = g(C,"rsvp.bouton") || "ENVOYER MA CONFIRMATION";
}
});
}
function sFinale(){
const fz = g(C,"finale",{});
return `<section id="finale" class="fond-noir"><svg class="brin-g" viewBox="0 0 160 60"><use href="#brin"/></svg><svg class="brin-d" viewBox="0 0 160 60"><use href="#brin"/></svg>
<div class="revele"><p class="petit please">${esc(fz.haut||"PLEASE")}</p>
<p class="gros">${esc(fz.grand||"RSVP")}</p>
${fz.limite?`<p class="lim">${esc(fz.limite)}</p>`:""}
<a class="btn-or" href="#rsvp">${esc(fz.bouton||"CONFIRMER MA PRÉSENCE")}</a>
<p class="merci-script">${esc(fz.script||"Thank you")}</p>
<p class="noms-fin">${esc((g(C,"couple.prenom1")+" & "+g(C,"couple.prenom2")).toUpperCase())}</p>
${g(C,"couple.hashtag")?`<p class="petit" style="margin-top:14px;color:var(--or2)">${esc(g(C,"couple.hashtag"))}</p>`:""}</div></section>`;
}
function sPied(){
return `<footer>
<div class="partage"><a id="pWa" target="_blank" rel="noopener">${WA}Partager sur WhatsApp</a><button type="button" id="pCopie">${ico("coeur")}Copier le lien</button></div>
<a class="signature" href="https://wa.me/243844195449" target="_blank" rel="noopener" aria-label="EL TSHI DIGIT, +243 844 195 449"><span>Invitation digitale réalisée par</span>${LOGO}<span class="tel">+243 844 195 449</span></a>
</footer>`;
}
function rendre(){
rendreCouverture();
$("#app").innerHTML = sPresentation() + sCompte() + sCeremonies() + sProgramme() + sPratique() + sGalerie() + sRsvp() + sFinale() + sPied();
formulaireRsvp(); lancerCompte(); lierCeremonies();
const msg = (g(C,"partage.message") || "Découvrez notre invitation :") + " " + lienPage();
const wa = "https://wa.me/?text=" + encodeURIComponent(msg);
$("#pWa").href = wa; $("#flottant").href = wa; $("#flottant").innerHTML = WA;
$("#pCopie").onclick = async () => { try { await navigator.clipboard.writeText(lienPage()); toast("Lien copié !"); } catch { prompt("Copiez ce lien :", lienPage()); } };
document.querySelectorAll(".tuile[data-i]").forEach(t => { const o = () => ouvrirVis(+t.dataset.i); t.onclick = o; t.onkeydown = e => { if (e.key === "Enter") o(); }; });
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("vu"); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll(".revele").forEach(el => io.observe(el));
}
function ouvrirVis(i){ idxVis = (i + photosGal.length) % photosGal.length; const v = $("#visionneuse"), p = photosGal[idxVis]; v.querySelector("img").src = p.url; v.querySelector("img").alt = p.legende || "Photo"; v.querySelector("p").textContent = p.legende || ""; v.hidden = false; }
$("#visionneuse .fermer").onclick = () => $("#visionneuse").hidden = true;
$("#visionneuse .prec").onclick = () => ouvrirVis(idxVis - 1);
$("#visionneuse .suiv").onclick = () => ouvrirVis(idxVis + 1);
$("#visionneuse").onclick = e => { if (e.target.id === "visionneuse") e.target.hidden = true; };
document.addEventListener("keydown", e => { if ($("#visionneuse").hidden) return; if (e.key === "Escape") $("#visionneuse").hidden = true; if (e.key === "ArrowLeft") ouvrirVis(idxVis-1); if (e.key === "ArrowRight") ouvrirVis(idxVis+1); });
function verrouiller(lienPerime){
VERROU = true;
const num = (EV.acces && EV.acces.numero) || "+243 844 195 449", chiffres = num.replace(/\D/g, "");
const noms = `${g(C,"couple.prenom1")} & ${g(C,"couple.prenom2")}`;
$("#ouvrir").hidden = true; $("#flottant").hidden = true;
const v = $("#verrou"); v.hidden = false;
v.innerHTML = `<p>${lienPerime ? "Ce lien n'est plus valide." : "Cette invitation est personnelle."} Pour découvrir le programme et confirmer votre présence, utilisez le lien officiel envoyé par les organisateurs.</p>
<a class="btn-or" target="_blank" rel="noopener" href="https://wa.me/${chiffres}?text=${encodeURIComponent("Bonjour, je souhaiterais recevoir le lien de l'invitation de " + noms + ".")}">${WA}Demander mon invitation</a>`;
}
function ouvrir(){
if (VERROU) return;
const c = $("#couv"); c.classList.add("ouvert"); document.body.classList.remove("ferme"); $("#app").hidden = false;
setTimeout(() => { c.classList.add("parti"); $("#flottant").classList.add("vu"); }, 1200);
window.scrollTo(0, 0);
}
$("#ouvrir").onclick = ouvrir;
window.addEventListener("message", e => {
if (e.origin !== location.origin || !e.data || e.data.type !== "apercu") return;
window.APERCU = true; C = e.data.config || {}; if (VERROU) { VERROU = false; $("#ouvrir").hidden = false; $("#verrou").hidden = true; $("#flottant").hidden = false; } rendre();
if (e.data.ouvrir && !$("#couv").classList.contains("ouvert")) ouvrir();
});
async function demarrer(){
if (!SLUG) { location.replace("/"); return; }
try {
const d = await rpc("config_evenement_v2", {p_slug: SLUG, p_cle: CLE || null, p_invite: INV || null});
if (!d) throw new Error("INTROUVABLE");
EV = d; C = d.config || {};
if (d.slug && d.slug !== SLUG) { const ancien = SLUG; SLUG = d.slug; try { const v = localStorage.getItem("rsvp-" + ancien); if (v && !localStorage.getItem("rsvp-" + SLUG)) localStorage.setItem("rsvp-" + SLUG, v); } catch {} try { history.replaceState(null, "", "/" + SLUG + location.search.replace(/([?&])e=[^&]*&?/, "$1").replace(/[?&]$/, "")); } catch {} }
const autorise = !d.acces || d.acces.ok;
try { if (autorise && CLE) localStorage.setItem("cle-" + SLUG, CLE); if (!autorise) localStorage.removeItem("cle-" + SLUG); } catch {}
const INVITE = d.invite && !d.invite.invalide ? d.invite : null; window.INVITE = INVITE;
try { if (INVITE && INV) localStorage.setItem("inv-" + SLUG, INV); if (d.invite && d.invite.invalide) { localStorage.removeItem("inv-" + SLUG); INV = ""; } } catch {}
if (autorise && new URLSearchParams(location.search).has("i")) { try { const q = new URLSearchParams(location.search); q.delete("i"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "")); } catch {} }
if (autorise && new URLSearchParams(location.search).has("k")) { try { const q = new URLSearchParams(location.search); q.delete("k"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "")); } catch {} }
if (autorise) rendre(); else { rendreCouverture(); verrouiller(!!CLE || !!(d.invite && d.invite.invalide)); }
$("#couv").hidden = false;
if (autorise && new URLSearchParams(location.search).has("direct")) ouvrir();
} catch (e) {
$("#introuvable").hidden = false; document.body.classList.remove("ferme");
} finally { $("#charge").classList.add("fin"); }
}
demarrer();
</script>
