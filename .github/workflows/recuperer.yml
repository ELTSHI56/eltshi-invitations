name: Recuperer le site en ligne
on: [push]
permissions:
  contents: write
jobs:
  recup:
    if: ${{ !contains(github.event.head_commit.message, '[site]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f admin.html && exit 0
          B=https://eltshi-invitations.vercel.app
          curl -sf -o admin.html $B/admin.html
          curl -sf -o invitation.html $B/invitation.html
          curl -sf -o index.html $B/
          curl -sf -o modele.json $B/modele.json
          sha1sum admin.html invitation.html index.html modele.json > empreintes.txt
          git config user.name "EL TSHI DIGIT"; git config user.email "actions@github.com"
          git add -A && git commit -m "[site] Version en ligne recuperee" && git push
